[package]
name = "stalwart-sieve-nats"
version = "0.1.0"
edition = "2021"
description = "Stalwart Sieve NATS plugin for OVERMIND Mail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-nats = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
