[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overmind-graph-writer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
