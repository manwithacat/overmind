[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overmind-graph-writer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.14.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
