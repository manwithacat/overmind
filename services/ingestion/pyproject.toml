[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overmind-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "pydantic>=2.0.0",
    "email-validator>=2.0.0",
    "mail-parser>=3.15.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
