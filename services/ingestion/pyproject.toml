[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overmind-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.14.0",
    "pydantic>=2.13.0",
    "email-validator>=2.3.0",
    "mail-parser>=4.2.1",
    "beautifulsoup4>=4.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
